<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Finance Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f0e;
    --surface: #161714;
    --surface2: #1e1f1c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0ede6;
    --muted: #888880;
    --faint: #444440;
    --accent-gold: #c9a84c;
    --accent-gold-dim: rgba(201,168,76,0.12);
    --accent-teal: #4db89a;
    --accent-teal-dim: rgba(77,184,154,0.1);
    --accent-coral: #d96b4a;
    --accent-coral-dim: rgba(217,107,74,0.1);
    --accent-blue: #5e9fd8;
    --accent-blue-dim: rgba(94,159,216,0.1);
    --accent-rose: #c06b8a;
    --accent-rose-dim: rgba(192,107,138,0.1);
    --accent-slate: #7c8fa0;
    --accent-slate-dim: rgba(124,143,160,0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem 2rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: rgba(14,15,14,0.92);
    backdrop-filter: blur(12px);
    z-index: 50;
  }

  .header-left { display: flex; flex-direction: column; gap: 4px; }

  .logo-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--accent-gold);
    text-transform: uppercase;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 400;
    color: var(--text);
    line-height: 1.1;
  }

  h1 em {
    font-style: italic;
    color: var(--accent-gold);
  }

  .header-stats {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-shrink: 0;
  }

  .stat {
    text-align: right;
  }

  .stat-n {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--text);
  }

  .stat-l {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stat-divider {
    width: 1px;
    height: 32px;
    background: var(--border2);
  }

  /* TOOLBAR */
  .toolbar {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 9px 12px 9px 36px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search:focus { border-color: var(--accent-gold); }
  #search::placeholder { color: var(--faint); }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
    white-space: nowrap;
  }

  .pill:hover {
    border-color: var(--border2);
    color: var(--text);
  }

  .pill.active {
    background: var(--accent-gold);
    border-color: var(--accent-gold);
    color: #0e0f0e;
  }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 140px);
  }

  /* SIDEBAR */
  aside {
    border-right: 1px solid var(--border);
    padding: 2rem 1.5rem;
    position: sticky;
    top: 140px;
    height: fit-content;
  }

  .aside-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    color: var(--faint);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .type-list { display: flex; flex-direction: column; gap: 2px; }

  .type-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    text-align: left;
    width: 100%;
    transition: all 0.15s;
  }

  .type-btn:hover { background: var(--surface2); color: var(--text); }
  .type-btn.active { background: var(--surface2); color: var(--text); }

  .type-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .type-count {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .aside-sep {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.25rem 0;
  }

  .add-resource-btn {
    width: 100%;
    padding: 9px 12px;
    border: 1px dashed var(--border2);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }

  .add-resource-btn:hover {
    border-color: var(--accent-gold);
    color: var(--accent-gold);
    background: var(--accent-gold-dim);
  }

  /* CONTENT */
  .content {
    padding: 2rem;
  }

  .section {
    margin-bottom: 3rem;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--text);
  }

  .section-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .cards { display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: border-color 0.15s, background 0.15s;
    cursor: default;
  }

  .card:hover {
    border-color: var(--border2);
    background: var(--surface2);
  }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .card-body { flex: 1; min-width: 0; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 3px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }

  .card-author {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: 'DM Mono', monospace;
  }

  .card-notes {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid;
    white-space: nowrap;
  }

  .card-link {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--accent-gold);
    text-decoration: none;
    border: 1px solid rgba(201,168,76,0.25);
    padding: 3px 9px;
    border-radius: 999px;
    transition: background 0.15s;
  }

  .card-link:hover { background: var(--accent-gold-dim); }

  .delete-btn {
    background: none;
    border: none;
    color: var(--faint);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--accent-coral); background: var(--accent-coral-dim); }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--faint);
    font-size: 13px;
  }

  .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.4; }

  /* MODAL */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 2rem;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }

  .form-group { margin-bottom: 1rem; }

  .form-group label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group textarea { min-height: 70px; resize: vertical; }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent-gold); }

  .form-group select option { background: var(--surface); }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 1.5rem;
  }

  .btn-cancel {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: var(--border2); color: var(--text); }

  .btn-save {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent-gold);
    color: #0e0f0e;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-save:hover { opacity: 0.88; }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .main { grid-template-columns: 1fr; }
    aside { position: static; border-right: none; border-bottom: 1px solid var(--border); padding: 1rem; }
    .type-list { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .type-btn { width: auto; padding: 6px 10px; font-size: 12px; }
    header { padding: 1.5rem 1rem 1rem; }
    .toolbar { padding: 1rem; }
    .content { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo-label">Finanza Quantitativa — Hub Risorse</span>
    <h1>Quant <em>Finance</em> Hub</h1>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-n" id="stat-total">0</div>
      <div class="stat-l">risorse</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n" id="stat-books">0</div>
      <div class="stat-l">libri</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n" id="stat-papers">0</div>
      <div class="stat-l">paper & altro</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Cerca titolo, autore, argomento..." oninput="render()">
  </div>
  <div class="filters" id="topic-pills"></div>
</div>

<div class="main">
  <aside>
    <div class="aside-label">Tipo</div>
    <div class="type-list" id="type-list"></div>
    <hr class="aside-sep">
    <button class="add-resource-btn" onclick="openModal()">
      <span style="font-size:16px">+</span> Aggiungi risorsa
    </button>
  </aside>
  <div class="content" id="content"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Aggiungi risorsa</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="form-group">
      <label>Tipo</label>
      <select id="f-type">
        <option value="book">Libro</option>
        <option value="paper">Paper</option>
        <option value="question">Domanda colloquio</option>
        <option value="link">Tool / Link</option>
      </select>
    </div>
    <div class="form-group">
      <label>Titolo / Domanda</label>
      <input type="text" id="f-title" placeholder="Es. Options, Futures and Other Derivatives">
    </div>
    <div class="form-group">
      <label>Autore / Fonte</label>
      <input type="text" id="f-author" placeholder="Es. John C. Hull">
    </div>
    <div class="form-group">
      <label>Note</label>
      <textarea id="f-notes" placeholder="Descrizione, capitoli utili, perché leggerlo..."></textarea>
    </div>
    <div class="form-group">
      <label>Argomento</label>
      <select id="f-topic-sel"></select>
    </div>
    <div class="form-group">
      <label>Link (opzionale)</label>
      <input type="url" id="f-link" placeholder="https://...">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-save" onclick="saveResource()">Salva</button>
    </div>
  </div>
</div>

<script>
const TOPICS = [
  { id: 'all', label: 'Tutti' },
  { id: 'bonds', label: 'Fixed Income', color: '#5e9fd8', dim: 'rgba(94,159,216,0.12)' },
  { id: 'equity', label: 'Equity Research', color: '#4db89a', dim: 'rgba(77,184,154,0.1)' },
  { id: 'derivatives', label: 'Derivatives', color: '#d96b4a', dim: 'rgba(217,107,74,0.1)' },
  { id: 'credit', label: 'Credit Risk', color: '#c9a84c', dim: 'rgba(201,168,76,0.1)' },
  { id: 'quant', label: 'Quant Methods', color: '#a07ed8', dim: 'rgba(160,126,216,0.1)' },
  { id: 'interview', label: 'Interview Prep', color: '#c06b8a', dim: 'rgba(192,107,138,0.1)' },
  { id: 'macro', label: 'Macro / Rates', color: '#7c8fa0', dim: 'rgba(124,143,160,0.1)' },
];

const TYPES = [
  { id: 'all', label: 'Tutti i tipi', icon: '◈' },
  { id: 'book', label: 'Libri', icon: '▣', color: '#4db89a' },
  { id: 'paper', label: 'Paper', icon: '◧', color: '#5e9fd8' },
  { id: 'question', label: 'Domande colloquio', icon: '◈', color: '#d96b4a' },
  { id: 'link', label: 'Tool & Link', icon: '◉', color: '#a07ed8' },
];

const TYPE_EMOJI = { book: '📖', paper: '📄', question: '💬', link: '🔗' };

let activeTopic = 'all';
let activeType = 'all';
let nextId = 100;

let resources = [
  { id: 1, type: 'book', title: 'Options, Futures and Other Derivatives', author: 'John C. Hull', notes: 'Il classico assoluto per derivati. Fondamentale per ogni colloquio in trading e structuring. Copre futures, pricing, swap, options, Greeks.', topic: 'derivatives', link: '' },
  { id: 2, type: 'book', title: 'Fixed Income Mathematics', author: 'Frank J. Fabozzi', notes: 'Teoria e pratica dei bond. Ottimo per pricing, duration, convexity e analisi dei titoli a reddito fisso.', topic: 'bonds', link: '' },
  { id: 3, type: 'book', title: 'Security Analysis', author: 'Benjamin Graham & David Dodd', notes: 'Testo fondamentale per equity research. Focus su valutazione fondamentale e analisi di bilancio.', topic: 'equity', link: '' },
  { id: 4, type: 'book', title: 'Credit Risk: Pricing, Measurement, and Management', author: 'David Lando', notes: 'Modelli di rischio di credito, CDS, structural models, intensity models. Rigore matematico elevato.', topic: 'credit', link: '' },
  { id: 5, type: 'book', title: 'Paul Wilmott on Quantitative Finance', author: 'Paul Wilmott', notes: 'Enciclopedia della finanza quant in 3 volumi. Ottimo come riferimento per modelli e derivati esotici.', topic: 'quant', link: '' },
  { id: 6, type: 'book', title: 'A Practical Guide to Quantitative Finance Interviews', author: 'Xinfeng Zhou', notes: 'Il libro per colloqui quant. Copre brain teasers, probabilità, calcolo stocastico, programmazione.', topic: 'interview', link: '' },
  { id: 7, type: 'book', title: 'Heard on the Street', author: 'Timothy Crack', notes: 'Domande di logica e probabilità tipiche nei colloqui di Wall Street.', topic: 'interview', link: '' },
  { id: 8, type: 'book', title: 'Stochastic Calculus for Finance I & II', author: 'Steven Shreve', notes: 'Testo rigoroso su calcolo stocastico applicato alla finanza. Vol I discreto, Vol II continuo.', topic: 'quant', link: '' },
  { id: 9, type: 'book', title: 'Interest Rate Risk in the Banking Book', author: 'BIS / BCBS', notes: 'Framework regolatorio Basel Committee su rischio tasso nel banking book. Utile per ruoli ALM e risk.', topic: 'bonds', link: '' },
  { id: 10, type: 'paper', title: 'The Pricing of Options and Corporate Liabilities', author: 'Black & Scholes (1973)', notes: 'Il paper originale di Black-Scholes. Must-read per capire la derivazione della formula.', topic: 'derivatives', link: 'https://www.cs.princeton.edu/courses/archive/fall09/cos323/papers/black_scholes73.pdf' },
  { id: 11, type: 'paper', title: 'On the Pricing of Corporate Debt', author: 'Robert Merton (1974)', notes: 'Structural model del credit risk. Base teorica dei modelli di default tipo KMV.', topic: 'credit', link: '' },
  { id: 12, type: 'paper', title: 'A Theory of the Term Structure of Interest Rates', author: 'Cox, Ingersoll & Ross (1985)', notes: 'Modello CIR per la struttura a termine dei tassi. Benchmark per i modelli a fattori.', topic: 'bonds', link: '' },
  { id: 13, type: 'paper', title: 'The Cross-Section of Expected Stock Returns', author: 'Fama & French (1992)', notes: 'Introduce il modello a 3 fattori FF. Fondamentale per factor investing e equity research quant.', topic: 'equity', link: '' },
  { id: 14, type: 'question', title: 'Come si prezza un interest rate swap?', author: 'Fixed Income', notes: 'Spiega discount factor, curva swap, NPV dei flussi fissi e variabili. Aspettati follow-up su OIS discounting vs LIBOR e gestione del basis risk.', topic: 'bonds', link: '' },
  { id: 15, type: 'question', title: "Qual è la differenza tra volatilità implicita e storica?", author: 'Derivatives', notes: 'Vol implicita = forward-looking estratta dal mercato tramite BS. Storica = backward-looking calcolata dai rendimenti passati. Discuti vol smile e surface.', topic: 'derivatives', link: '' },
  { id: 16, type: 'question', title: 'Come costruisci un DCF? Quali sono i punti critici?', author: 'Equity Research', notes: 'Proietta i free cash flow, attualizza al WACC, aggiungi terminal value. Rischi principali: sensibilità al WACC e al tasso di crescita g. Sanity check con multipli.', topic: 'equity', link: '' },
  { id: 17, type: 'question', title: "Che cos'è il CVA e come si calcola?", author: 'Credit Risk', notes: 'Credit Valuation Adjustment: valore atteso della perdita per rischio controparte nei derivati OTC. CVA = -LGD × ∫EE(t)·dPD(t). Collegalo a DVA e XVA.', topic: 'credit', link: '' },
  { id: 18, type: 'question', title: 'Spiega i Greeks di un\'opzione vanilla', author: 'Derivatives', notes: 'Delta, gamma, theta, vega, rho. Come si comportano rispetto al moneyness e alla scadenza. Come il market maker usa il delta hedging dinamico.', topic: 'derivatives', link: '' },
  { id: 19, type: 'question', title: 'Come si costruisce una yield curve da zero?', author: 'Fixed Income', notes: 'Bootstrapping da strumenti liquidi: depositi, FRA, futures, swap. Scelta del metodo di interpolazione (linear, cubic spline). Differenza OIS vs swap curve post-2008.', topic: 'bonds', link: '' },
  { id: 20, type: 'question', title: "Cos'è il modello di Merton e quali sono i suoi limiti?", author: 'Credit Risk', notes: 'Equity = call sul valore degli asset. Limiti: struttura del capitale semplificata, volatilità costante, difficoltà nel calibrare dati non osservabili.', topic: 'credit', link: '' },
  { id: 21, type: 'link', title: 'QuantLib — libreria open source per pricing', author: 'quantlib.org', notes: 'Libreria C++ con Python binding per fixed income, derivati e risk management. Standard de facto nella finanza quant accademica.', topic: 'quant', link: 'https://www.quantlib.org' },
  { id: 22, type: 'link', title: 'Damodaran Online — dataset e modelli di valutazione', author: 'Aswath Damodaran (NYU Stern)', notes: 'Dataset aggiornati su beta, WACC, multipli settoriali. Essenziale per valutazione aziendale.', topic: 'equity', link: 'https://pages.stern.nyu.edu/~adamodar/' },
  { id: 23, type: 'link', title: 'FRED — Federal Reserve Economic Data', author: 'Federal Reserve Bank of St. Louis', notes: 'Database macro gratuito. Tassi, inflazione, GDP e molto altro. API disponibile.', topic: 'macro', link: 'https://fred.stlouisfed.org' },
  { id: 24, type: 'link', title: 'SSRN — Social Science Research Network', author: 'ssrn.com', notes: 'Repository principale per preprint in finanza ed economia. Ideale per trovare paper recenti su qualsiasi argomento.', topic: 'quant', link: 'https://www.ssrn.com' },
];

function topicById(id) { return TOPICS.find(t => t.id === id) || TOPICS[0]; }

function render() {
  renderTopicPills();
  renderTypeSidebar();
  renderContent();
  renderStats();
}

function renderTopicPills() {
  const c = document.getElementById('topic-pills');
  c.innerHTML = TOPICS.map(t => `<button class="pill ${activeTopic === t.id ? 'active' : ''}" onclick="setTopic('${t.id}')">${t.label}</button>`).join('');
}

function renderTypeSidebar() {
  const tl = document.getElementById('type-list');
  tl.innerHTML = TYPES.map(t => {
    const count = t.id === 'all' ? resources.length : resources.filter(r => r.type === t.id).length;
    return `<button class="type-btn ${activeType === t.id ? 'active' : ''}" onclick="setType('${t.id}')">
      <span class="type-dot" style="background:${t.color || '#888880'}"></span>
      ${t.label}
      <span class="type-count">${count}</span>
    </button>`;
  }).join('');
}

function renderStats() {
  document.getElementById('stat-total').textContent = resources.length;
  document.getElementById('stat-books').textContent = resources.filter(r => r.type === 'book').length;
  document.getElementById('stat-papers').textContent = resources.filter(r => r.type !== 'book').length;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return resources.filter(r => {
    if (activeTopic !== 'all' && r.topic !== activeTopic) return false;
    if (activeType !== 'all' && r.type !== activeType) return false;
    if (q && !r.title.toLowerCase().includes(q) && !(r.author||'').toLowerCase().includes(q) && !(r.notes||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderContent() {
  const content = document.getElementById('content');
  const filtered = getFiltered();
  const sections = [
    { key: 'book', label: 'Libri consigliati' },
    { key: 'paper', label: 'Paper & articoli' },
    { key: 'question', label: 'Domande da colloquio' },
    { key: 'link', label: 'Tool & link utili' },
  ];
  const visibleSections = activeType === 'all' ? sections : sections.filter(s => s.key === activeType);

  let html = '';
  for (const s of visibleSections) {
    const items = filtered.filter(r => r.type === s.key);
    if (items.length === 0 && activeType !== 'all') {
      html += `<div class="empty"><div class="empty-icon">◈</div>Nessuna risorsa trovata</div>`;
      continue;
    }
    if (items.length === 0) continue;
    const typeInfo = TYPES.find(t => t.key === s.key) || {};
    html += `<div class="section">
      <div class="section-header">
        <span class="section-title">${s.label}</span>
        <span class="section-badge">${items.length} risorse</span>
      </div>
      <div class="cards">
        ${items.map(r => renderCard(r)).join('')}
      </div>
    </div>`;
  }

  if (!html) html = `<div class="empty"><div class="empty-icon">◈</div>Nessuna risorsa trovata. Prova a modificare i filtri.</div>`;
  content.innerHTML = html;
}

function renderCard(r) {
  const topic = topicById(r.topic);
  const tagStyle = `color:${topic.color}; border-color:${topic.color}33;`;
  const iconBg = `background:${topic.dim || 'rgba(255,255,255,0.05)'};`;
  return `<div class="card">
    <div class="card-icon" style="${iconBg}">${TYPE_EMOJI[r.type]}</div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-title">${r.title}</span>
        <button class="delete-btn" onclick="deleteResource(${r.id})" title="Rimuovi">&#x2715;</button>
      </div>
      ${r.author ? `<div class="card-author">${r.author}</div>` : ''}
      ${r.notes ? `<div class="card-notes">${r.notes}</div>` : ''}
      <div class="card-footer">
        <span class="tag" style="${tagStyle}">${topic.label}</span>
        ${r.link ? `<a class="card-link" href="${r.link}" target="_blank" rel="noopener">↗ Apri</a>` : ''}
      </div>
    </div>
  </div>`;
}

function setTopic(id) { activeTopic = id; render(); }
function setType(id) { activeType = id; render(); }

function deleteResource(id) {
  resources = resources.filter(r => r.id !== id);
  render();
}

function openModal() {
  const topicSel = document.getElementById('f-topic-sel');
  topicSel.innerHTML = TOPICS.filter(t => t.id !== 'all').map(t => `<option value="${t.id}">${t.label}</option>`).join('');
  if (activeTopic !== 'all') topicSel.value = activeTopic;
  document.getElementById('f-title').value = '';
  document.getElementById('f-author').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-link').value = '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }

function saveResource() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  resources.push({
    id: nextId++,
    type: document.getElementById('f-type').value,
    title,
    author: document.getElementById('f-author').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    topic: document.getElementById('f-topic-sel').value,
    link: document.getElementById('f-link').value.trim(),
  });
  closeModal();
  render();
}

document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
</script>
</body>
</html>
