<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Finance Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f0e;
  --surface: #161714;
  --surface2: #1e1f1c;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0ede6;
  --muted: #888880;
  --faint: #444440;
  --accent-gold: #c9a84c;
  --accent-gold-dim: rgba(201,168,76,0.12);
  --accent-teal: #4db89a;
  --accent-teal-dim: rgba(77,184,154,0.1);
  --accent-coral: #d96b4a;
  --accent-coral-dim: rgba(217,107,74,0.1);
  --accent-blue: #5e9fd8;
  --accent-blue-dim: rgba(94,159,216,0.1);
  --accent-rose: #c06b8a;
  --accent-rose-dim: rgba(192,107,138,0.1);
  --accent-purple: #a07ed8;
  --accent-slate: #7c8fa0;
  --accent-slate-dim: rgba(124,143,160,0.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* HEADER */
header {
  border-bottom: 1px solid var(--border);
  padding: 2.5rem 2rem 2rem;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  background: rgba(14,15,14,0.92);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.header-left { display: flex; flex-direction: column; gap: 4px; }
.logo-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--accent-gold);
  text-transform: uppercase;
}
h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 400;
  color: var(--text);
  line-height: 1.1;
}
h1 em { font-style: italic; color: var(--accent-gold); }
.header-stats {
  display: flex;
  gap: 1.5rem;
  align-items: center;
  flex-shrink: 0;
}
.stat { text-align: right; }
.stat-n {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
  color: var(--text);
}
.stat-l {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.stat-divider { width: 1px; height: 32px; background: var(--border2); }

/* TOOLBAR */
.toolbar {
  padding: 1.25rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 1rem;
  align-items: center;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
#search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 9px 12px 9px 36px;
  outline: none;
  transition: border-color 0.2s;
}
#search:focus { border-color: var(--accent-gold); }
#search::placeholder { color: var(--faint); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.04em;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.pill:hover { border-color: var(--border2); color: var(--text); }
.pill.active { background: var(--accent-gold); border-color: var(--accent-gold); color: #0e0f0e; }

/* MAIN LAYOUT */
.main {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100vh - 140px);
}

/* SIDEBAR */
aside {
  border-right: 1px solid var(--border);
  padding: 2rem 1.5rem;
  position: sticky;
  top: 140px;
  height: fit-content;
}
.aside-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--faint);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
}
.type-list { display: flex; flex-direction: column; gap: 2px; }
.type-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  background: transparent;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  text-align: left;
  width: 100%;
  transition: all 0.15s;
}
.type-btn:hover { background: var(--surface2); color: var(--text); }
.type-btn.active { background: var(--surface2); color: var(--text); }
.type-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.type-count {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--faint);
}
.aside-sep { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
.add-resource-btn {
  width: 100%;
  padding: 9px 12px;
  border: 1px dashed var(--border2);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
}
.add-resource-btn:hover {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  background: var(--accent-gold-dim);
}

/* CONTENT */
.content { padding: 2rem; }
.section {
  margin-bottom: 3rem;
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.section-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.section-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.15rem;
  font-weight: 400;
  color: var(--text);
}
.section-badge {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--faint);
}
.cards { display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  transition: border-color 0.15s, background 0.15s;
  cursor: default;
}
.card:hover { border-color: var(--border2); background: var(--surface2); }
.card:hover .card-actions { opacity: 1; }
.card-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}
.card-body { flex: 1; min-width: 0; }
.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 3px;
}
.card-title { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
.card-author {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
  font-family: 'DM Mono', monospace;
}
.card-notes { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
.card-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}
.card-link {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  color: var(--accent-gold);
  text-decoration: none;
  border: 1px solid rgba(201,168,76,0.25);
  padding: 3px 9px;
  border-radius: 999px;
  transition: background 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.card-link:hover { background: var(--accent-gold-dim); }
.card-link.pdf { color: var(--accent-coral); border-color: rgba(217,107,74,0.25); }
.card-link.pdf:hover { background: var(--accent-coral-dim); }
.card-link.embedded-pdf { color: var(--accent-teal); border-color: rgba(77,184,154,0.25); }
.card-link.embedded-pdf:hover { background: var(--accent-teal-dim); }

/* Card action buttons */
.card-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s;
}
.card-action-btn {
  background: none;
  border: none;
  color: var(--faint);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 4px;
  transition: all 0.15s;
}
.card-action-btn.edit:hover   { color: var(--accent-gold);  background: var(--accent-gold-dim); }
.card-action-btn.delete:hover { color: var(--accent-coral); background: var(--accent-coral-dim); }

/* EMPTY */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--faint);
  font-size: 13px;
}
.empty-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.4; }

/* PDF VIEWER MODAL */
.pdf-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 300;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.pdf-overlay.open { display: flex; }
.pdf-modal {
  width: 100%;
  max-width: 900px;
  height: 90vh;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pdf-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.pdf-title {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pdf-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  flex-shrink: 0;
  margin-left: 12px;
}
.pdf-frame { flex: 1; width: 100%; border: none; background: #fff; }

/* MODAL */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 2rem;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}
.modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.2rem;
  font-weight: 400;
}
.modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
.form-group { margin-bottom: 1rem; }
.form-group label {
  display: block;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group textarea { min-height: 70px; resize: vertical; }
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--accent-gold); }
.form-group select option { background: var(--surface); }

/* PDF upload area */
.pdf-upload-area {
  border: 1px dashed var(--border2);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  position: relative;
}
.pdf-upload-area:hover, .pdf-upload-area.dragover {
  border-color: var(--accent-coral);
  background: var(--accent-coral-dim);
}
.pdf-upload-area input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  background: none;
}
.pdf-upload-label {
  font-size: 12px;
  color: var(--muted);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.pdf-upload-label span { font-size: 18px; }
.pdf-selected {
  font-size: 12px;
  color: var(--accent-coral);
  font-family: 'DM Mono', monospace;
  margin-top: 6px;
  display: none;
  align-items: center;
  gap: 6px;
}
.pdf-selected.show { display: flex; }
.pdf-clear-btn {
  background: none;
  border: none;
  color: var(--faint);
  cursor: pointer;
  font-size: 14px;
  padding: 0 2px;
}
.pdf-clear-btn:hover { color: var(--accent-coral); }

/* existing embedded PDF badge in edit modal */
.pdf-existing {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--accent-teal-dim);
  border: 1px solid rgba(77,184,154,0.2);
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  color: var(--accent-teal);
}
.pdf-existing.show { display: flex; }
.pdf-existing-label { flex: 1; }
.pdf-existing-remove {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  padding: 0 2px;
  transition: color 0.15s;
}
.pdf-existing-remove:hover { color: var(--accent-coral); }

/* divider */
.or-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}
.or-divider span {
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.5rem; }
.btn-cancel {
  padding: 8px 18px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--border2); color: var(--text); }
.btn-save {
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  background: var(--accent-gold);
  color: #0e0f0e;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-save:hover { opacity: 0.88; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .main { grid-template-columns: 1fr; }
  aside { position: static; border-right: none; border-bottom: 1px solid var(--border); padding: 1rem; }
  .type-list { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .type-btn { width: auto; padding: 6px 10px; font-size: 12px; }
  header { padding: 1.5rem 1rem 1rem; }
  .toolbar { padding: 1rem; }
  .content { padding: 1rem; }
  .card-actions { opacity: 1; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo-label">Finanza Quantitativa — Hub Risorse</span>
    <h1>Quant <em>Finance</em> Hub</h1>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-n" id="stat-total">0</div>
      <div class="stat-l">risorse</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n" id="stat-books">0</div>
      <div class="stat-l">libri</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n" id="stat-papers">0</div>
      <div class="stat-l">paper & altro</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Cerca titolo, autore, argomento..." oninput="render()">
  </div>
  <div class="filters" id="topic-pills"></div>
</div>

<div class="main">
  <aside>
    <div class="aside-label">Tipo</div>
    <div class="type-list" id="type-list"></div>
    <hr class="aside-sep">
    <button class="add-resource-btn" onclick="openModal()">
      <span style="font-size:16px">+</span> Aggiungi risorsa
    </button>
  </aside>
  <div class="content" id="content"></div>
</div>

<!-- ADD / EDIT RESOURCE MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title-label">Aggiungi risorsa</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>

    <div class="form-group">
      <label>Tipo</label>
      <select id="f-type">
        <option value="book">Libro</option>
        <option value="paper">Paper</option>
        <option value="question">Domanda colloquio</option>
        <option value="link">Tool / Link</option>
      </select>
    </div>

    <div class="form-group">
      <label>Titolo / Domanda</label>
      <input type="text" id="f-title" placeholder="Es. Options, Futures and Other Derivatives">
    </div>

    <div class="form-group">
      <label>Autore / Fonte</label>
      <input type="text" id="f-author" placeholder="Es. John C. Hull">
    </div>

    <div class="form-group">
      <label>Note</label>
      <textarea id="f-notes" placeholder="Descrizione, capitoli utili, perché leggerlo..."></textarea>
    </div>

    <div class="form-group">
      <label>Argomento</label>
      <select id="f-topic-sel"></select>
    </div>

    <div class="form-group">
      <label>Link web (opzionale)</label>
      <input type="url" id="f-link" placeholder="https://...">
    </div>

    <div class="form-group">
      <label>PDF</label>

      <!-- Shown in edit mode when a PDF is already embedded -->
      <div class="pdf-existing" id="pdf-existing-indicator">
        <span>📄</span>
        <span class="pdf-existing-label">PDF già caricato</span>
        <button class="pdf-existing-remove" onclick="removeExistingPDF()" title="Rimuovi PDF incorporato">✕</button>
      </div>

      <div class="pdf-upload-area" id="pdf-drop-area">
        <input type="file" id="f-pdf-file" accept=".pdf,application/pdf" onchange="handlePDFFile(this)">
        <div class="pdf-upload-label">
          <span>📎</span> Carica PDF dal tuo computer
        </div>
      </div>
      <div class="pdf-selected" id="pdf-selected-name">
        <span>📄</span>
        <span id="pdf-name-label">file.pdf</span>
        <button class="pdf-clear-btn" onclick="clearPDF()">✕</button>
      </div>

      <div class="or-divider"><span>oppure</span></div>

      <input type="url" id="f-pdf-link" placeholder="URL diretto a un PDF (es. arXiv, Drive...)">
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-save" id="modal-save-btn" onclick="saveResource()">Salva</button>
    </div>
  </div>
</div>

<!-- ADD TOPIC MODAL -->
<div class="overlay" id="topic-overlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">Nuovo argomento</span>
      <button class="modal-close" onclick="closeTopicModal()">&#x2715;</button>
    </div>
    <div class="form-group">
      <label>Nome argomento</label>
      <input type="text" id="t-label" placeholder="Es. Portfolio Management">
    </div>
    <div class="form-group">
      <label>Colore</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="color" id="t-color" value="#e8a04a"
          style="width:44px;height:36px;padding:2px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);cursor:pointer"
          oninput="updateColorPreview()">
        <div id="t-color-preview" style="flex:1;height:36px;border-radius:6px;border:1px solid var(--border);transition:background 0.2s"></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" id="t-color-presets"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeTopicModal()">Annulla</button>
      <button class="btn-save" onclick="saveTopic()">Aggiungi</button>
    </div>
  </div>
</div>

<!-- PDF VIEWER -->
<div class="pdf-overlay" id="pdf-overlay">
  <div class="pdf-modal">
    <div class="pdf-header">
      <span class="pdf-title" id="pdf-viewer-title">Documento</span>
      <button class="pdf-close" onclick="closePDFViewer()">&#x2715;</button>
    </div>
    <iframe class="pdf-frame" id="pdf-frame" src="" title="PDF viewer"></iframe>
  </div>
</div>

<script>
const TOPICS = [
  { id: 'all', label: 'Tutti' },
  { id: 'bonds',       label: 'Fixed Income',    color: '#5e9fd8', dim: 'rgba(94,159,216,0.12)' },
  { id: 'equity',      label: 'Equity Research', color: '#4db89a', dim: 'rgba(77,184,154,0.1)'  },
  { id: 'derivatives', label: 'Derivatives',     color: '#d96b4a', dim: 'rgba(217,107,74,0.1)'  },
  { id: 'credit',      label: 'Credit Risk',     color: '#c9a84c', dim: 'rgba(201,168,76,0.1)'  },
  { id: 'quant',       label: 'Quant Methods',   color: '#a07ed8', dim: 'rgba(160,126,216,0.1)' },
  { id: 'interview',   label: 'Interview Prep',  color: '#c06b8a', dim: 'rgba(192,107,138,0.1)' },
  { id: 'macro',       label: 'Macro / Rates',   color: '#7c8fa0', dim: 'rgba(124,143,160,0.1)' },
];

const TYPES = [
  { id: 'all',      label: 'Tutti i tipi',     icon: '◈' },
  { id: 'book',     label: 'Libri',             icon: '▣', color: '#4db89a' },
  { id: 'paper',    label: 'Paper',             icon: '◧', color: '#5e9fd8' },
  { id: 'question', label: 'Domande colloquio', icon: '◈', color: '#d96b4a' },
  { id: 'link',     label: 'Tool & Link',       icon: '◉', color: '#a07ed8' },
];

const TYPE_EMOJI = { book: '📖', paper: '📄', question: '💬', link: '🔗' };

let activeTopic    = 'all';
let activeType     = 'all';
let nextId         = 100;
let pendingPDFData = null;   // base64 of newly uploaded PDF
let editingId      = null;   // id being edited (null = new)
let editRemovePDF  = false;  // user requested removal of existing embedded PDF

// ── STORAGE ───────────────────────────────────────────────────────────
const LS_KEY      = 'qfhub_resources_v2';
const LS_PDF_KEY  = 'qfhub_pdfs_v1';

function loadResources() {
  try { const r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return null;
}
function saveResources() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(resources)); } catch(e) {}
}
function savePDF(id, data) {
  try {
    const s = JSON.parse(localStorage.getItem(LS_PDF_KEY) || '{}');
    s[id] = data;
    localStorage.setItem(LS_PDF_KEY, JSON.stringify(s));
  } catch(e) { console.warn('PDF storage failed:', e); return false; }
  return true;
}
function loadPDF(id) {
  try { const s = JSON.parse(localStorage.getItem(LS_PDF_KEY) || '{}'); return s[id] || null; } catch(e) { return null; }
}
function deletePDF(id) {
  try {
    const s = JSON.parse(localStorage.getItem(LS_PDF_KEY) || '{}');
    delete s[id];
    localStorage.setItem(LS_PDF_KEY, JSON.stringify(s));
  } catch(e) {}
}

// ── DEFAULT DATA (empty) ──────────────────────────────────────────────
const DEFAULT_RESOURCES = [];
let resources = loadResources() || DEFAULT_RESOURCES;

// ── PDF HANDLING ──────────────────────────────────────────────────────
function handlePDFFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingPDFData = e.target.result;
    document.getElementById('pdf-name-label').textContent = file.name;
    document.getElementById('pdf-selected-name').classList.add('show');
    document.getElementById('f-pdf-link').value = '';
  };
  reader.readAsDataURL(file);
}

function clearPDF() {
  pendingPDFData = null;
  document.getElementById('f-pdf-file').value = '';
  document.getElementById('pdf-selected-name').classList.remove('show');
}

function removeExistingPDF() {
  editRemovePDF = true;
  document.getElementById('pdf-existing-indicator').classList.remove('show');
}

// Drag & drop
const dropArea = document.getElementById('pdf-drop-area');
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') {
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById('f-pdf-file').files = dt.files;
    handlePDFFile(document.getElementById('f-pdf-file'));
  }
});

// ── PDF VIEWER ────────────────────────────────────────────────────────
function openPDFViewer(id, title) {
  const data = loadPDF(id);
  if (!data) return;
  document.getElementById('pdf-viewer-title').textContent = title;
  document.getElementById('pdf-frame').src = data;
  document.getElementById('pdf-overlay').classList.add('open');
}
function openPDFLink(url, title) {
  document.getElementById('pdf-viewer-title').textContent = title;
  document.getElementById('pdf-frame').src = url;
  document.getElementById('pdf-overlay').classList.add('open');
}
function closePDFViewer() {
  document.getElementById('pdf-overlay').classList.remove('open');
  document.getElementById('pdf-frame').src = '';
}

// ── RENDER ────────────────────────────────────────────────────────────
function topicById(id) { return TOPICS.find(t => t.id === id) || TOPICS[1]; }

function render() {
  renderTopicPills();
  renderTypeSidebar();
  renderContent();
  renderStats();
}

function renderTopicPills() {
  const c = document.getElementById('topic-pills');
  const pills = TOPICS.map(t =>
    `<button class="pill ${activeTopic === t.id ? 'active' : ''}" onclick="setTopic('${t.id}')">${t.label}</button>`
  ).join('');
  const addBtn = `<button class="pill" onclick="openTopicModal()" title="Aggiungi argomento" style="border-style:dashed;padding:6px 10px;font-size:14px;line-height:1">+</button>`;
  c.innerHTML = pills + addBtn;
}

function renderTypeSidebar() {
  const tl = document.getElementById('type-list');
  tl.innerHTML = TYPES.map(t => {
    const count = t.id === 'all' ? resources.length : resources.filter(r => r.type === t.id).length;
    return `<button class="type-btn ${activeType === t.id ? 'active' : ''}" onclick="setType('${t.id}')">
      <span class="type-dot" style="background:${t.color || '#888880'}"></span>
      ${t.label}
      <span class="type-count">${count}</span>
    </button>`;
  }).join('');
}

function renderStats() {
  document.getElementById('stat-total').textContent  = resources.length;
  document.getElementById('stat-books').textContent  = resources.filter(r => r.type === 'book').length;
  document.getElementById('stat-papers').textContent = resources.filter(r => r.type !== 'book').length;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return resources.filter(r => {
    if (activeTopic !== 'all' && r.topic !== activeTopic) return false;
    if (activeType  !== 'all' && r.type  !== activeType)  return false;
    if (q && !r.title.toLowerCase().includes(q) &&
        !(r.author||'').toLowerCase().includes(q) &&
        !(r.notes||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderContent() {
  const content  = document.getElementById('content');
  const filtered = getFiltered();
  const sections = [
    { key: 'book',     label: 'Libri consigliati' },
    { key: 'paper',    label: 'Paper & articoli' },
    { key: 'question', label: 'Domande da colloquio' },
    { key: 'link',     label: 'Tool & link utili' },
  ];
  const visibleSections = activeType === 'all' ? sections : sections.filter(s => s.key === activeType);

  let html = '';
  for (const s of visibleSections) {
    const items = filtered.filter(r => r.type === s.key);
    if (items.length === 0 && activeType !== 'all') {
      html += `<div class="empty"><div class="empty-icon">◈</div>Nessuna risorsa trovata</div>`;
      continue;
    }
    if (items.length === 0) continue;
    html += `<div class="section">
      <div class="section-header">
        <span class="section-title">${s.label}</span>
        <span class="section-badge">${items.length} risorse</span>
      </div>
      <div class="cards">${items.map(r => renderCard(r)).join('')}</div>
    </div>`;
  }
  if (!html) html = `<div class="empty"><div class="empty-icon">◈</div>Nessuna risorsa trovata. Prova a modificare i filtri.</div>`;
  content.innerHTML = html;
}

function renderCard(r) {
  const topic    = topicById(r.topic);
  const tagStyle = `color:${topic.color}; border-color:${topic.color}33;`;
  const iconBg   = `background:${topic.dim || 'rgba(255,255,255,0.05)'};`;

  let linkBtns = '';
  if (r.link) linkBtns += `<a class="card-link" href="${escHtml(r.link)}" target="_blank" rel="noopener">↗ Apri</a>`;
  if (r.hasPDF) {
    linkBtns += `<button class="card-link embedded-pdf" onclick="openPDFViewer(${r.id},'${escJs(r.title)}')">📄 PDF</button>`;
  } else if (r.pdfLink) {
    linkBtns += `<a class="card-link pdf" href="${escHtml(r.pdfLink)}" target="_blank" rel="noopener">📄 PDF</a>`;
  }

  return `<div class="card">
    <div class="card-icon" style="${iconBg}">${TYPE_EMOJI[r.type]}</div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-title">${escHtml(r.title)}</span>
        <div class="card-actions">
          <button class="card-action-btn edit"   onclick="openEditModal(${r.id})" title="Modifica">✎</button>
          <button class="card-action-btn delete" onclick="deleteResource(${r.id})" title="Rimuovi">✕</button>
        </div>
      </div>
      ${r.author ? `<div class="card-author">${escHtml(r.author)}</div>` : ''}
      ${r.notes  ? `<div class="card-notes">${escHtml(r.notes)}</div>`   : ''}
      <div class="card-footer">
        <span class="tag" style="${tagStyle}">${topic.label}</span>
        ${linkBtns}
      </div>
    </div>
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ── ACTIONS ───────────────────────────────────────────────────────────
function setTopic(id) { activeTopic = id; render(); }
function setType(id)  { activeType  = id; render(); }

function deleteResource(id) {
  resources = resources.filter(r => r.id !== id);
  deletePDF(id);
  saveResources();
  render();
}

// ── MODAL helpers ─────────────────────────────────────────────────────
function _populateTopicSelect(selectedId) {
  const sel = document.getElementById('f-topic-sel');
  sel.innerHTML = TOPICS.filter(t => t.id !== 'all').map(t =>
    `<option value="${t.id}">${t.label}</option>`
  ).join('');
  if (selectedId) sel.value = selectedId;
}

function _resetModalPDFFields() {
  clearPDF();
  document.getElementById('f-pdf-link').value = '';
  document.getElementById('pdf-existing-indicator').classList.remove('show');
}

// ── OPEN ADD MODAL ────────────────────────────────────────────────────
function openModal() {
  editingId      = null;
  editRemovePDF  = false;
  pendingPDFData = null;

  document.getElementById('modal-title-label').textContent = 'Aggiungi risorsa';
  document.getElementById('modal-save-btn').textContent    = 'Salva';

  _populateTopicSelect(activeTopic !== 'all' ? activeTopic : null);
  document.getElementById('f-type').value   = 'book';
  document.getElementById('f-title').value  = '';
  document.getElementById('f-author').value = '';
  document.getElementById('f-notes').value  = '';
  document.getElementById('f-link').value   = '';
  _resetModalPDFFields();

  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

// ── OPEN EDIT MODAL ───────────────────────────────────────────────────
function openEditModal(id) {
  const r = resources.find(x => x.id === id);
  if (!r) return;

  editingId      = id;
  editRemovePDF  = false;
  pendingPDFData = null;

  document.getElementById('modal-title-label').textContent = 'Modifica risorsa';
  document.getElementById('modal-save-btn').textContent    = 'Aggiorna';

  _populateTopicSelect(r.topic);
  document.getElementById('f-type').value   = r.type;
  document.getElementById('f-title').value  = r.title;
  document.getElementById('f-author').value = r.author  || '';
  document.getElementById('f-notes').value  = r.notes   || '';
  document.getElementById('f-link').value   = r.link    || '';

  clearPDF();
  document.getElementById('f-pdf-link').value = r.hasPDF ? '' : (r.pdfLink || '');

  // Show embedded PDF badge if one exists
  const existingEl = document.getElementById('pdf-existing-indicator');
  if (r.hasPDF) existingEl.classList.add('show');
  else          existingEl.classList.remove('show');

  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

// ── SAVE / UPDATE ─────────────────────────────────────────────────────
function saveResource() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }

  const pdfLink = document.getElementById('f-pdf-link').value.trim();

  if (editingId !== null) {
    // ── UPDATE existing resource ──────────────────────────────────────
    const r = resources.find(x => x.id === editingId);
    if (!r) return;

    r.type   = document.getElementById('f-type').value;
    r.title  = title;
    r.author = document.getElementById('f-author').value.trim();
    r.notes  = document.getElementById('f-notes').value.trim();
    r.topic  = document.getElementById('f-topic-sel').value;
    r.link   = document.getElementById('f-link').value.trim();

    if (pendingPDFData) {
      // Replace embedded PDF with new upload
      const ok = savePDF(r.id, pendingPDFData);
      if (ok) { r.hasPDF = true; r.pdfLink = ''; }
      else alert('PDF troppo grande per il browser locale (>5 MB). Usa un link esterno.');
    } else if (editRemovePDF) {
      // User removed the embedded PDF
      deletePDF(r.id);
      r.hasPDF  = false;
      r.pdfLink = pdfLink;
    } else if (!r.hasPDF) {
      // No embedded PDF: just update the URL
      r.pdfLink = pdfLink;
    }

  } else {
    // ── ADD new resource ──────────────────────────────────────────────
    const id = nextId++;
    let hasPDF = false;

    if (pendingPDFData) {
      const ok = savePDF(id, pendingPDFData);
      if (ok) hasPDF = true;
      else alert('PDF troppo grande per il browser locale (>5 MB). Usa un link esterno.');
    }

    resources.push({
      id,
      type:    document.getElementById('f-type').value,
      title,
      author:  document.getElementById('f-author').value.trim(),
      notes:   document.getElementById('f-notes').value.trim(),
      topic:   document.getElementById('f-topic-sel').value,
      link:    document.getElementById('f-link').value.trim(),
      pdfLink: hasPDF ? '' : pdfLink,
      hasPDF,
    });
  }

  saveResources();
  closeModal();
  render();
}

// ── TOPIC MODAL ───────────────────────────────────────────────────────
const TOPIC_COLORS  = ['#5e9fd8','#4db89a','#d96b4a','#c9a84c','#a07ed8','#c06b8a','#7c8fa0','#e8a04a','#60c8e0','#9ad86a'];
const LS_TOPICS_KEY = 'qfhub_topics_v1';

function loadCustomTopics() {
  try { const r = localStorage.getItem(LS_TOPICS_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return [];
}
function saveCustomTopics(custom) { localStorage.setItem(LS_TOPICS_KEY, JSON.stringify(custom)); }

// Merge custom topics at startup
(function() {
  loadCustomTopics().forEach(t => { if (!TOPICS.find(x => x.id === t.id)) TOPICS.push(t); });
})();

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function updateColorPreview() {
  document.getElementById('t-color-preview').style.background = hexToRgba(document.getElementById('t-color').value, 0.25);
}

function openTopicModal() {
  document.getElementById('t-label').value = '';
  document.getElementById('t-color').value = '#e8a04a';
  updateColorPreview();
  document.getElementById('t-color-presets').innerHTML = TOPIC_COLORS.map(c =>
    `<button onclick="pickPresetColor('${c}')" style="width:22px;height:22px;border-radius:50%;background:${c};border:2px solid transparent;cursor:pointer;transition:transform 0.15s;flex-shrink:0" title="${c}" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'"></button>`
  ).join('');
  document.getElementById('topic-overlay').classList.add('open');
  setTimeout(() => document.getElementById('t-label').focus(), 100);
}
function pickPresetColor(hex) { document.getElementById('t-color').value = hex; updateColorPreview(); }
function closeTopicModal() { document.getElementById('topic-overlay').classList.remove('open'); }

function saveTopic() {
  const label = document.getElementById('t-label').value.trim();
  if (!label) { document.getElementById('t-label').focus(); return; }
  const color = document.getElementById('t-color').value;
  const id    = label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  if (TOPICS.find(t => t.id === id)) { alert('Esiste già un argomento con questo nome.'); return; }
  const newTopic = { id, label, color, dim: hexToRgba(color, 0.1) };
  TOPICS.push(newTopic);
  const custom = loadCustomTopics(); custom.push(newTopic); saveCustomTopics(custom);
  closeTopicModal();
  render();
}

// close overlays on backdrop click / Escape
document.getElementById('overlay').addEventListener('click',       e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('topic-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeTopicModal(); });
document.getElementById('pdf-overlay').addEventListener('click',   e => { if (e.target === e.currentTarget) closePDFViewer(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeTopicModal(); closePDFViewer(); }
});

render();
</script>
</body>
</html>
